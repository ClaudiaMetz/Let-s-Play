<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060a10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Let's Play">
  <link rel="manifest" href="manifest.webmanifest">

  <title>Let's Play</title>
    <link rel="stylesheet" href="./css/landing.css">
</head>
<body>
  <main class="landing">
    <div class="logo-stage" id="logoStage" aria-label="Let's Play"><h1 class="logo-title"><span>LET'S</span><span>PLAY</span></h1></div>
    <p class="tagline">JUEGOS OFFLINE PARA <em>FARMEAR AURA COMO UN CAMPEÓN</em></p>
    <section class="actions ready" id="actions" aria-label="Elegir cómo jugar">
      <a class="action play" href="games.html">▶ JUGAR ONLINE</a>
      <button class="action install" id="installApp" type="button">★ DESCARGALO Y JUGÁ EN TU DISPOSITIVO CUANDO QUIERAS ★</button>
      <p class="data-note">La app funciona sin conexión. El ranking global estará disponible cuando conectemos el servicio propio.</p>
    </section>
    <video class="landing-loop" autoplay muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1">
      <source src="./assets/pablis-games-loop.mp4" type="video/mp4">
    </video>
    <p class="credit">LET'S PLAY · SIN PUBLICIDAD</p>
  </main>
  <section class="install-help" id="installHelp" hidden aria-modal="true" role="dialog" aria-labelledby="installTitle">
    <div class="install-card">
      <button class="install-close" id="installClose" type="button" aria-label="Cerrar">×</button>
      <h2 id="installTitle">INSTALAR LET'S PLAY</h2>
      <p id="installSteps"></p>
    </div>
  </section>
  <script src="./js/app/landing.js"></script>
</body>
</html>
